[package]
name = "knockport-relay"
version = "0.1.0"
edition = "2021"
description = "KnockPort CORS relay — forwards browser API requests server-side (API-client traffic only, never load testing)"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tropel-http = { path = "D:/tropel/crates/tropel-http" }
tropel-sdk = { path = "D:/tropel/crates/tropel-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
